<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4176e6"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#f8fafc"/>

  <!-- ===== DSH 网页 (Client) ===== -->
  <g>
    <rect x="30" y="110" width="250" height="200" rx="14" fill="#ffffff" stroke="#dbe4f5" stroke-width="1.5"/>
    <path d="M30,124 a14,14 0 0 1 14,-14 h222 a14,14 0 0 1 14,14 v26 h-250 z" fill="#4176e6"/>
    <text x="155" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">DSH 网页（Client · 浏览器）</text>
    <text x="50" y="180" font-size="12.5" fill="#334155">· 设备列表按钮</text>
    <text x="50" y="206" font-size="12.5" fill="#334155">· 右侧控制区（宽度自适应）</text>
    <text x="50" y="232" font-size="12.5" fill="#334155">· video（jmuxer 解码 H.264）</text>
    <text x="50" y="258" font-size="12.5" fill="#334155">· 鼠标触控 / 系统按键</text>
    <text x="50" y="284" font-size="12.5" fill="#334155">· hilog 实时日志</text>
  </g>

  <!-- ===== DSH Host (Node.js) ===== -->
  <g>
    <rect x="340" y="110" width="220" height="200" rx="14" fill="#ffffff" stroke="#cfe8d8" stroke-width="1.5"/>
    <path d="M340,124 a14,14 0 0 1 14,-14 h192 a14,14 0 0 1 14,14 v26 h-220 z" fill="#16a34a"/>
    <text x="450" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">DSH Host（Node.js）</text>
    <text x="360" y="180" font-size="12.5" fill="#334155">· 配置读写（$DSH_HOME）</text>
    <text x="360" y="206" font-size="12.5" fill="#334155">· 环境检测（JAVA_HOME / hdc）</text>
    <text x="360" y="232" font-size="12.5" fill="#334155">· 设备发现（hdc list）</text>
    <text x="360" y="258" font-size="12.5" fill="#334155">· device:connect 拉起 sidecar</text>
    <text x="360" y="284" font-size="12.5" fill="#334155">· JSON RPC 路由 /dsh-hos-scrcpy</text>
  </g>

  <!-- ===== Java sidecar ===== -->
  <g>
    <rect x="620" y="110" width="230" height="200" rx="14" fill="#ffffff" stroke="#f6e2bd" stroke-width="1.5"/>
    <path d="M620,124 a14,14 0 0 1 14,-14 h202 a14,14 0 0 1 14,14 v26 h-230 z" fill="#f59e0b"/>
    <text x="735" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Java sidecar</text>
    <text x="640" y="180" font-size="12.5" fill="#334155">· Main --sn &lt;SN&gt; --hdc …</text>
    <text x="640" y="206" font-size="12.5" fill="#334155">· ws://127.0.0.1 随机端口</text>
    <text x="640" y="232" font-size="12.5" fill="#334155">· H.264 帧广播</text>
    <text x="640" y="258" font-size="12.5" fill="#334155">· 触控 / 按键注入</text>
    <text x="640" y="284" font-size="12.5" fill="#334155">· hilog 流</text>
  </g>

  <!-- ===== 鸿蒙手机 ===== -->
  <g>
    <rect x="902" y="95" width="72" height="230" rx="16" fill="#1e293b"/>
    <rect x="907" y="100" width="62" height="220" rx="12" fill="#e2e8f0"/>
    <rect x="928" y="106" width="20" height="3" rx="1.5" fill="#94a3b8"/>
    <rect x="925" y="300" width="26" height="3" rx="1.5" fill="#94a3b8"/>
    <text x="938" y="355" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">鸿蒙</text>
    <text x="938" y="373" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">手机</text>
  </g>

  <!-- ===== 连线 ===== -->
  <!-- 浏览器 <-> Host: host.call -->
  <line x1="280" y1="170" x2="338" y2="170" stroke="#4176e6" stroke-width="2" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="309" y="160" text-anchor="middle" font-size="11.5" fill="#4176e6" font-weight="600">host.call</text>
  <text x="309" y="196" text-anchor="middle" font-size="10.5" fill="#94a3b8">RPC</text>

  <!-- Host -> sidecar: spawn -->
  <line x1="560" y1="170" x2="618" y2="170" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="589" y="160" text-anchor="middle" font-size="11.5" fill="#f59e0b" font-weight="600">spawn</text>
  <text x="589" y="196" text-anchor="middle" font-size="10.5" fill="#94a3b8">拉起</text>

  <!-- sidecar -> 手机: hdc -->
  <line x1="850" y1="210" x2="900" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="875" y="200" text-anchor="middle" font-size="11.5" fill="#64748b" font-weight="600">hdc</text>

  <!-- 浏览器 <-> sidecar: WebSocket 直连 -->
  <path d="M155,312 C155,400 735,400 735,312" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="445" y="400" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">WebSocket 直连（不经 Host 中转）</text>
  <text x="445" y="420" text-anchor="middle" font-size="11" fill="#94a3b8">视频帧 → 触控 / 按键 / 日志 →</text>
</svg>
